# RoadSnake-GBRG: frozen RoadSnake-R1 P4 path plus training-only P3 region guidance.
# The auxiliary gradient magnitude is controlled at the shared P3 feature and
# neither the region logits nor their target participate in detection inference.

nc: 80
end2end: True
reg_max: 1
gbrg_target_gradient_ratio: 0.03
gbrg_max_gradient_ratio: 0.08
gbrg_lambda_ema: 0.9
gbrg_lambda_min: 0.1
gbrg_lambda_max: 100.0
gbrg_sigma_divisor: 6.0
gbrg_ignore_dilation: 1.25
gbrg_background_ratio: 3.0
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 1, C3k2, [1024, True, 0.5, True]]
  - [[16, 19, 22], 1, RoadSnakeGBRGDetect, [nc, 5, 0.25, 1.0, 0.0]]
